services:
  db:
    image: postgres:18.4
    environment:
      POSTGRES_USER: universident
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: universident
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U universident -d universident"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
