      :root {
        color-scheme: light dark;
        --background: #e3efff;
        --foreground: #10233f;
        --card: #ffffff;
        --muted: #506681;
        --primary: #2563eb;
        --on-primary: #ffffff;
        --page-glow-rgb: 33 68 112;
        --relief-highlight: #ffffffb8;
        --relief-edge: #55749a36;
        --relief-shadow: #16385326;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        background-color: var(--background);
        /* Match the existing homepage: blue shade in light, pale blue glow in dark. */
        background-image: radial-gradient(
          ellipse max(60rem, 85vw) 90rem at 100% 0,
          rgb(var(--page-glow-rgb) / .14) 0%,
          rgb(var(--page-glow-rgb) / .10) 20%,
          rgb(var(--page-glow-rgb) / .045) 45%,
          rgb(var(--page-glow-rgb) / .012) 70%,
          rgb(var(--page-glow-rgb) / 0) 100%
        );
        background-repeat: no-repeat;
        background-size: 100% 100%;
        color: var(--foreground);
        font-family: Figtree, ui-sans-serif, system-ui, sans-serif;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      header {
        flex-shrink: 0;
        background: color-mix(in srgb, var(--background) 96%, var(--card));
        border-bottom: 1px solid var(--relief-edge);
        box-shadow: inset 0 -1px 0 var(--relief-highlight), 0 8px 22px -14px var(--relief-shadow);
      }
      .header-inner {
        display: flex;
        align-items: center;
        width: 100%;
        max-width: 72rem;
        min-height: 5rem;
        margin-inline: auto;
        padding-inline: 1.5rem;
      }
      .brand { display: block; width: 13rem; height: auto; }
      main {
        flex: 1;
        display: grid;
        place-items: center;
        width: 100%;
        max-width: 75rem;
        margin-inline: auto;
        padding: clamp(3.5rem, 8vh, 6rem) 1.5rem;
      }
      .message {
        width: 100%;
        max-width: 48rem;
        padding-block: 1rem;
        text-align: center;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: .625rem;
        font-size: .9375rem;
        font-weight: 500;
      }
      .status svg { width: 1.25rem; height: 1.25rem; flex-shrink: 0; color: var(--primary); }
      h1 {
        max-width: 44rem;
        margin: 1.25rem auto 1.35rem;
        font-size: clamp(2rem, 4.6vw, 3.4rem);
        font-weight: 550;
        line-height: 1.12;
        letter-spacing: -.045em;
        text-wrap: balance;
        overflow-wrap: break-word;
      }
      p { margin: 0; color: var(--muted); line-height: 1.75; }
      .description { max-width: 30rem; margin-inline: auto; font-size: 1.0625rem; text-wrap: pretty; }
      .retry {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: .75rem;
        min-height: 3rem;
        margin-top: 1.8rem;
        padding: .75rem 1.25rem;
        border: 1px solid transparent;
        border-radius: .875rem;
        background: var(--primary);
        color: var(--on-primary);
        box-shadow: inset 0 1px 0 #ffffff30, 0 4px 18px #1a4f8c16;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 500;
        line-height: 1.25;
        text-decoration: none;
        transition: background-color 150ms, box-shadow 150ms, transform 150ms;
      }
      .retry span { transition: transform 150ms; }
      .retry:hover { background: color-mix(in srgb, var(--primary) 90%, var(--foreground)); }
      .retry:hover span { transform: translateX(2px); }
      .retry:active { transform: translateY(1px); }
      .retry:focus-visible { outline: 3px solid var(--primary); outline-offset: 4px; }
      .thanks { margin-top: 1.25rem; font-size: .875rem; }
      footer {
        margin-top: auto;
        border-top: 1px solid var(--relief-edge);
        background: color-mix(in srgb, var(--background) 96%, var(--card));
        box-shadow: inset 0 1px 0 var(--relief-highlight), 0 -6px 18px -14px var(--relief-shadow);
      }
      .footer-inner {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: .5rem 1.5rem;
        max-width: 75rem;
        margin-inline: auto;
        padding: 1.25rem 1.5rem;
        color: var(--muted);
        font-size: .8125rem;
        line-height: 1.6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #08111f;
          --foreground: #e8eef7;
          --card: #101c2d;
          --muted: #94a3b8;
          --primary: #60a5fa;
          --on-primary: #07111f;
          --page-glow-rgb: 179 211 250;
          --relief-highlight: #c4ddff21;
          --relief-edge: #020813b3;
          --relief-shadow: #0208136b;
        }
      }
      @media (max-width: 767px) {
        main { padding-inline: 1.25rem; }
        h1 { font-size: clamp(1.8rem, 6vw, 2.65rem); letter-spacing: -.035em; line-height: 1.15; }
        .description { font-size: 1rem; }
        .footer-inner { flex-direction: column; padding: 1rem 1.25rem; gap: .25rem; }
      }
      @media (max-width: 639px) {
        .header-inner { min-height: 4.5rem; padding-inline: 1rem; }
        .brand { width: 11rem; }
      }
      @media (prefers-reduced-motion: reduce) {
        .retry, .retry span { transition: none; }
        .retry:hover span, .retry:active { transform: none; }
      }
    </style>
  </head>
