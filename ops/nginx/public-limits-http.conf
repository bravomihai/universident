# Include inside nginx's http block, once. These zones do not affect a
# virtual host until public-limits-server.conf is included in that host.
map "$request_method:$uri" $universident_public_client {
    default "";
    ~^(GET|HEAD):/$ $binary_remote_addr;
    ~^(GET|HEAD):/studenti(/|$) $binary_remote_addr;
    ~^(GET|HEAD):/sitemap\.xml$ $binary_remote_addr;
    ~^(GET|HEAD):/api/studenti/.*/disponibilitati/?$ $binary_remote_addr;
}

map $universident_public_client $universident_public_global {
    "" "";
    default "universident";
}

limit_req_zone $universident_public_client zone=universident_public_client:10m rate=2r/s;
limit_req_zone $universident_public_global zone=universident_public_global:1m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=universident_connections:10m;
