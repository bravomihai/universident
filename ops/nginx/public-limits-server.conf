# Include only in the existing universident.ro server block. Keep its TLS,
# proxy, health endpoint and existing headers. Validate with nginx -t first.
client_max_body_size 3m;
client_body_timeout 20s;
client_header_timeout 20s;

limit_req zone=universident_public_client burst=30 nodelay;
limit_req zone=universident_public_global burst=100 nodelay;
limit_req_status 429;
limit_conn universident_connections 100;
limit_conn_status 429;
