# Include once in each existing application HTTPS server block, BEFORE any
# server-level return/rewrite. Preserve TLS, HTTP redirects and ACME handling.
# Install ops/maintenance/index.html at the path below before enabling the flag.
# Do not turn this into a location-only guard: more specific API/static locations
# would bypass it. The internal error-page redirect converts POST etc. to GET.
error_page 503 =503 /__universident_maintenance.html;

# Always observe flag changes immediately, even if the host caches file lookups.
open_file_cache off;

# Allow only the internal error-page handler past the server rewrite guard.
# Direct external requests to this URI still receive 404 because it is internal.
if ($uri = /__universident_maintenance.html) {
    break;
}
if (-f /var/www/universident-maintenance/enabled) {
    return 503;
}

location = /__universident_maintenance.html {
    internal;
    alias /var/www/universident-maintenance/index.html;
    types { }
    default_type text/html;
    charset utf-8;
    etag off;
    if_modified_since off;

    add_header Retry-After "3600" always;
    add_header Cache-Control "no-store, max-age=0" always;
    # Location-level add_header replaces inherited headers on older nginx.
    # Repeat the application's global security headers for this static response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Only this standalone page permits inline CSS, embedded logos and Figtree fonts.
    # Scripts, forms, network requests and framing remain disabled.
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}
