name: universident

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: "postgresql://${POSTGRES_USER:-universident}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-universident}?schema=public"
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
  RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
  EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM is required}

services:
  db:
    image: postgres:18.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-universident}
      POSTGRES_USER: ${POSTGRES_USER:-universident}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 1m
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  migrate:
    build:
      context: .
      target: migrator
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools
    restart: "no"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  app:
    build:
      context: .
      target: runner
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  postgres_data:

networks:
  default:
